<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin.css') }}">

    <style>
        .change-box{
            width:420px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        .change-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        .change-box label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        .change-box input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .change-box button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
            color:white;
            background:#1976d2;
        }

        .change-box button:hover{
            background:#1565c0;
        }

        .success{
            background:#d4edda;
            color:#155724;
            padding:10px;
            border-radius:5px;
            margin-top:15px;
            text-align:center;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
            padding:10px;
            border-radius:5px;
            margin-top:15px;
            text-align:center;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

        .back a{
            text-decoration:none;
        }

        .back button{
            width:auto;
            padding:10px 20px;
            background:#555;
        }
    </style>

</head>

<body>

<div class="change-box">

    <h2>🔑 Change Admin Password</h2>

    {% if message %}
        <div class="success">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Current Password</label>
        <input
            type="password"
            name="current_password"
            required>

        <label>New Password</label>
        <input
            type="password"
            name="new_password"
            required>

        <label>Confirm New Password</label>
        <input
            type="password"
            name="confirm_password"
            required>

        <button type="submit">
            Change Password
        </button>

    </form>

    <div class="back">

        <a href="{{ url_for('admin') }}">
            <button type="button">
                ⬅ Back to Admin
            </button>
        </a>

    </div>

</div>

</body>
</html>
